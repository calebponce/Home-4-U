name: App Quality

on:
  push:
    branches:
      - master
      - main
      - "caleb-*"
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: application/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: DATABASE_URL=sqlite:////tmp/home4u-alembic-ci.db python -m alembic upgrade head
      - run: DATABASE_URL=sqlite:////tmp/home4u-smoke-ci.db PYTHONPATH=. ./run_smoke_tests.sh
