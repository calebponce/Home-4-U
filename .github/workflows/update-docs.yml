name: Update Project Documentation

on:
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - 'application/**'
      - 'milestones/**'
      - 'deployment/**'
  pull_request:
    branches:
      - master
      - main
      - develop
    paths:
      - 'application/**'
      - 'milestones/**'
      - 'deployment/**'
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pyyaml
      
      - name: Generate documentation
        run: |
          python .github/workflows/generate_docs.py
      
      - name: Verify generated documentation is current
        run: git diff --exit-code -- PROJECT_DOCUMENTATION.md

